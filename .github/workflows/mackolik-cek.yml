name: mackolik-cek
on:
  push:
    branches: [claude/inspiring-lovelace-x274hy]
    paths: [.github/workflows/mackolik-cek.yml, mackolik/**]
  workflow_dispatch:
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sayfayi indir (mobil User-Agent)
        run: |
          curl -sSL --retry 5 --retry-all-errors -A 'Mozilla/5.0 (Linux; Android 14; Pixel 8)' \
            -o gs_kas.html -w 'HTTP %{http_code} | %{size_download} bayt | %{url_effective}\n' \
            'https://www.mackolik.com/mac/galatasaray-vs-kas%C4%B1mpa%C5%9Fa/iddaa/cmgalzgjhe6ijnsh6but6ccus'
      - name: Tum Iddaa marketleri
        run: python3 mackolik/yeni_site_iddaa_ayristir.py gs_kas.html
      - name: Mac Skoru
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, 'mackolik')
          from yeni_site_iddaa_ayristir import ayristir
          t = open('gs_kas.html', encoding='utf-8').read()
          for ad, secenekler in ayristir(t):
              if 'skor' in ad.lower():
                  print('###', ad)
                  for s, o in secenekler:
                      print(f'  {s}: {o}')
          PY
