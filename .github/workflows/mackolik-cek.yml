name: mackolik-cek
on:
  push:
    branches: [claude/inspiring-lovelace-x274hy]
    paths: [.github/workflows/mackolik-cek.yml, mackolik/**]
  workflow_dispatch:
jobs:
  cek:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (Linux; Android 14; Pixel 8)'
      MAC_ID: cmgalzgjhe6ijnsh6but6ccus
      SLUG: galatasaray-vs-kas%C4%B1mpa%C5%9Fa
    steps:
      - uses: actions/checkout@v4
      - name: Sayfayi indir
        run: |
          curl -sSL --retry 5 --retry-all-errors -A "$UA" -o sayfa.html -w 'HTTP %{http_code} | %{size_download} bayt\n' \
            "https://www.mackolik.com/mac/$SLUG/iddaa/$MAC_ID"
      - name: Mac ana sayfasi
        run: |
          curl -sSL --retry 5 --retry-all-errors -A "$UA" -o mac.html -w 'HTTP %{http_code} | %{size_download} bayt\n' \
            "https://www.mackolik.com/mac/$SLUG/$MAC_ID"
      - name: Ifade aramasi
        run: python3 mackolik/ara.py sayfa.html mac.html
      - name: Ajax marketleri
        run: |
          KOD=$(grep -o 'code=[0-9]*' sayfa.html | head -1 | cut -d= -f2); echo "iddaaCode=$KOD"
          curl -sSL --retry 5 --retry-all-errors -A "$UA" -H 'X-Requested-With: XMLHttpRequest' -o ajax.json \
            -w 'HTTP %{http_code} | %{size_download} bayt\n' \
            "https://www.mackolik.com/ajax/iddaa/markets/soccer/all/$MAC_ID?template=all&iddaaCode=$KOD"
          python3 -c "import json;d=json.load(open('ajax.json'));open('ajax.html','w').write(d.get('data',{}).get('html',''))" || head -c 500 ajax.json
          python3 mackolik/ara.py ajax.html
