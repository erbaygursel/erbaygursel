name: mackolik-cek
on:
  push:
    branches: [claude/inspiring-lovelace-x274hy]
    paths: [.github/workflows/mackolik-cek.yml, mackolik/**]
  workflow_dispatch:
jobs:
  cek:
    runs-on: ubuntu-latest
    env:
      UA: 'Mozilla/5.0 (Linux; Android 14; Pixel 8)'
      TAKIM1: eyüp
      TAKIM2: göztepe
    steps:
      - uses: actions/checkout@v4
      - name: Fiksturleri indir
        run: |
          for S in "" "2025-2026/" "2026-2027/"; do
            curl -sSL --retry 5 --retry-all-errors -A "$UA" -o "fikstur_${S%/}.html" -w "fikstur[$S] HTTP %{http_code} | %{size_download} bayt\n" \
              "https://www.mackolik.com/puan-durumu/t%C3%BCrkiye-trendyol-s%C3%BCper-lig/${S}fikstur/482ofyysbdbeoxauk19yg7tdt" || true
          done
          curl -sSL --retry 5 --retry-all-errors -A "$UA" -o iddaa_liste.html -w "iddaa listesi HTTP %{http_code}\n" https://www.mackolik.com/iddaa || true
      - name: Maci bul
        run: |
          python3 mackolik/mac_bul.py "$TAKIM1" "$TAKIM2" fikstur_*.html iddaa_liste.html | tee maclar.txt
          test -s maclar.txt
      - name: Iddaa sayfalarini cek ve ayristir
        run: |
          while read SLUG MID; do
            echo "=================== $SLUG $MID"
            curl -sSL --retry 5 --retry-all-errors -A "$UA" -o "m_$MID.html" -w 'HTTP %{http_code} | %{size_download} bayt | %{url_effective}\n' \
              "https://www.mackolik.com/mac/$SLUG/iddaa/$MID"
            python3 mackolik/yeni_site_iddaa_ayristir.py "m_$MID.html" || true
            python3 mackolik/ara.py "m_$MID.html" | grep -E '^===|: [1-9]|Karşılıklı geçen|^      ' || true
          done < maclar.txt
